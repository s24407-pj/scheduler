server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        path: /
        same-site: lax
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Regex of proxy IPs whose X-Forwarded-For is trusted; empty trusts none (remoteAddr is the direct peer).
      internal-proxies: ${TRUSTED_PROXIES:}

spring:
  application:
    name: scheduler
  session:
    timeout: 24h
    data:
      redis:
        namespace: scheduler:sessions
        repository-type: indexed
  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          java_time_use_direct_jdbc: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

otp:
  # Mandatory positive operator-configured cap in prod; zero disables this cap in development only.
  global-daily-sms-cap: ${OTP_GLOBAL_DAILY_SMS_CAP:0}

login:
  max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
  rate-window-minutes: ${LOGIN_RATE_WINDOW_MINUTES:1}

r2:
  endpoint: ${R2_ENDPOINT:https://639e21e02511acaeaf95b06bc9e3450b.r2.cloudflarestorage.com}
  access-key: ${R2_ACCESS_KEY:}
  secret-key: ${R2_SECRET_KEY:}
  bucket-name: ${R2_BUCKET_NAME:scheduler}
  public-url: ${R2_PUBLIC_URL:https://pub-e2e7a57b5ea74031a70f3c42d58af33f.r2.dev}

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  metrics:
    tags:
      application: scheduler
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
      sla:
        http.server.requests: 100ms, 250ms, 500ms, 1s, 2s, 5s
