services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scheduler:local
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/scheduler_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the deployment environment}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SESSION_TIMEOUT: ${SPRING_SESSION_TIMEOUT:-24h}
      SPRING_SESSION_DATA_REDIS_NAMESPACE: ${SPRING_SESSION_DATA_REDIS_NAMESPACE:-scheduler:sessions}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in the deployment environment}
      TZ: Europe/Warsaw
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      OTP_GLOBAL_DAILY_SMS_CAP: ${OTP_GLOBAL_DAILY_SMS_CAP:?Set a positive OTP_GLOBAL_DAILY_SMS_CAP}
      JUSTSEND_APP_KEY: ${JUSTSEND_APP_KEY:-}
      JUSTSEND_SENDER: ${JUSTSEND_SENDER:-}
      SMS_WORKER_OTP_CONCURRENCY: ${SMS_WORKER_OTP_CONCURRENCY:-2}
      SMS_WORKER_NOTIFICATION_CONCURRENCY: ${SMS_WORKER_NOTIFICATION_CONCURRENCY:-4}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER: ${SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER:-X-Forwarded-For}
      R2_ENDPOINT: ${R2_ENDPOINT:?Set R2_ENDPOINT in the deployment environment}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:?Set R2_ACCESS_KEY in the deployment environment}
      R2_SECRET_KEY: ${R2_SECRET_KEY:?Set R2_SECRET_KEY in the deployment environment}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in the deployment environment}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:?Set R2_PUBLIC_URL in the deployment environment}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: scheduler_db
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in the deployment environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d scheduler_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

# Explicit membership survives Dokploy adding an ingress network to app.
# Keep db and redis off ingress networks in Dokploy; see docs/deployment.md.
networks:
  backend:

volumes:
  postgres_data:
  redis_data:
