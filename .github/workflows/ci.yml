name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: UTC

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25.0.4+101.0.LTS' # Temurin 25.0.4.1+1, in Adoptium SemVer
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Record toolchain and Docker availability
        run: |
          java --version
          ./gradlew --version
          docker info

      # build already includes spotlessCheck through the check lifecycle.
      - name: Build, check formatting and run tests
        run: ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Docker diagnostics
        if: failure()
        run: docker ps -a --no-trunc

      - name: Upload test reports and build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-test-reports
          path: |
            build/reports/
            build/test-results/
            build/generated/openapi.json
            ${{ runner.temp }}/gradle-build.log
          if-no-files-found: warn
          retention-days: 7
